name: Release

# Publishes every app as a GitHub Release, signed with the real production
# keystore — this is what you actually install/update from. Deliberate
# only: fires on a pushed version tag, not on every commit.
#
#   git tag v1.2.0 && git push origin v1.2.0

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name for the release (e.g. v1.2.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # A deliberate, tagged release should always be signed with the real
      # keystore — no silent debug-signed fallback here (see ci.yml for
      # that). Fails loudly with a pointer to the setup doc if it's missing.
      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [[ -z "${KEYSTORE_BASE64}" ]]; then
            echo "::error::KEYSTORE_BASE64 is not set — see keystore/README.md. Refusing to publish an unsigned/debug-signed release."
            exit 1
          fi

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/keystore/void-ecosystem-release.jks"
          cat > "$GITHUB_WORKSPACE/keystore.properties" <<EOF
          storeFile=keystore/void-ecosystem-release.jks
          storePassword=$KEYSTORE_STORE_PASSWORD
          keyAlias=$KEYSTORE_KEY_ALIAS
          keyPassword=$KEYSTORE_KEY_PASSWORD
          EOF

      # No module prefix builds every app module (:app plus all ~18 pillar
      # apps) in one invocation.
      - name: Build signed release APKs (every app)
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --console=plain 2>&1 | tee build.log || {
            echo "::group::Compiler diagnostics"
            grep -E "^e: |: error:" build.log | head -150 || true
            echo "::endgroup::"
            exit 1
          }

      - name: Resolve release tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Collect built APKs
        id: apks
        run: |
          set -euo pipefail
          mkdir -p dist
          count=0
          while IFS= read -r -d '' apk; do
            # Prefix with the module's project dir name (e.g. "app",
            # "theming", "calculator") so every APK gets a unique,
            # recognizable filename once collected into one flat dist/.
            rel="${apk#./}"
            module_path="${rel%/build/outputs/apk/*}"
            module=$(basename "$module_path")
            cp "$apk" "dist/void-${module}-release.apk"
            count=$((count + 1))
          done < <(find . -path "*/build/outputs/apk/release/*.apk" -print0)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [[ "$count" -eq 0 ]]; then
            echo "::error::No APKs found under any module's build/outputs/apk/release" >&2
            exit 1
          fi
          ls -la dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Void Ecosystem ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: dist/*.apk
          body: >-
            ${{ steps.apks.outputs.count }} apps built as separate installable
            APKs, signed with the production keystore — grab the ones you
            want individually, or start with void-app-*.apk (the dashboard)
            to download and install the rest in-app.

      - name: Remove signing material from the runner
        if: always()
        run: rm -f keystore.properties keystore/void-ecosystem-release.jks
