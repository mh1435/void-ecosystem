name: Build and Release APK

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch: {}

# Needed so the workflow can create a GitHub Release with the default token.
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: app/build.gradle.kts derives versionCode from
          # `git rev-list --count HEAD`, which needs the whole log, not a
          # shallow depth-1 checkout, or every build would report versionCode=1.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Production releases need the real keystore secrets (see
      # keystore/README.md) so every build shares one signature forever —
      # that's what makes in-place updates work. Until those four secrets
      # exist, this falls back to an unsigned-for-production debug build
      # (Gradle's own auto-generated debug key) so pushes still produce an
      # installable APK instead of hard-failing the workflow.
      - name: Check for signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [[ -n "${KEYSTORE_BASE64}" ]]; then
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KEYSTORE_BASE64 secret is not set — building an unsigned-for-production DEBUG APK instead. See keystore/README.md to enable real signed releases."
          fi

      - name: Decode signing keystore
        if: steps.signing.outputs.has_keystore == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/keystore/void-ecosystem-release.jks"
          cat > "$GITHUB_WORKSPACE/keystore.properties" <<EOF
          storeFile=keystore/void-ecosystem-release.jks
          storePassword=$KEYSTORE_STORE_PASSWORD
          keyAlias=$KEYSTORE_KEY_ALIAS
          keyPassword=$KEYSTORE_KEY_PASSWORD
          EOF

      - name: Build signed release APK
        if: steps.signing.outputs.has_keystore == 'true'
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Build debug APK (fallback, unsigned for production)
        if: steps.signing.outputs.has_keystore == 'false'
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Resolve release tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Locate built APK
        id: apk
        run: |
          if [[ "${{ steps.signing.outputs.has_keystore }}" == "true" ]]; then
            apk_path=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          else
            apk_path=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          fi
          if [[ -z "$apk_path" ]]; then
            echo "::error::No built APK found under app/build/outputs/apk" >&2
            exit 1
          fi
          echo "path=$apk_path" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: >-
            Void Ecosystem ${{ steps.tag.outputs.tag }}${{ steps.signing.outputs.has_keystore == 'false' && ' (debug, unsigned for production)' || '' }}
          prerelease: ${{ steps.signing.outputs.has_keystore == 'false' }}
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}
          body: >-
            ${{ steps.signing.outputs.has_keystore == 'false' && 'Built without the production signing secrets (KEYSTORE_BASE64 etc, see keystore/README.md), so this is a debug build: fine to sideload and test, but future signed releases will NOT install over it as an update. Set up the keystore secrets to get real, upgradeable release builds.' || '' }}

      - name: Remove signing material from the runner
        if: always()
        run: rm -f keystore.properties keystore/void-ecosystem-release.jks
