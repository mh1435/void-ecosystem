name: Build and Release APKs

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch: {}

# Needed so the workflow can create a GitHub Release with the default token.
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the root build.gradle.kts derives versionCode
          # (shared by every app) from `git rev-list --count HEAD`, which
          # needs the whole log, not a shallow depth-1 checkout.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Production releases need the real keystore secrets (see
      # keystore/README.md) so every app's build shares one signature
      # forever — that's what makes in-place updates work. Until those
      # four secrets exist, this falls back to unsigned-for-production
      # debug APKs (Gradle's own auto-generated debug key) so pushes
      # still produce installable APKs instead of hard-failing.
      - name: Check for signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [[ -n "${KEYSTORE_BASE64}" ]]; then
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KEYSTORE_BASE64 secret is not set — building unsigned-for-production DEBUG APKs instead. See keystore/README.md to enable real signed releases."
          fi

      - name: Decode signing keystore
        if: steps.signing.outputs.has_keystore == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/keystore/void-ecosystem-release.jks"
          cat > "$GITHUB_WORKSPACE/keystore.properties" <<EOF
          storeFile=keystore/void-ecosystem-release.jks
          storePassword=$KEYSTORE_STORE_PASSWORD
          keyAlias=$KEYSTORE_KEY_ALIAS
          keyPassword=$KEYSTORE_KEY_PASSWORD
          EOF

      # Running `assembleRelease`/`assembleDebug` with no module prefix
      # builds that task for every application module at once — :app plus
      # all ~18 standalone pillar apps — without listing each one by hand.
      - name: Build signed release APKs (every app)
        if: steps.signing.outputs.has_keystore == 'true'
        run: ./gradlew assembleRelease --no-daemon

      - name: Build debug APKs (fallback, unsigned for production)
        if: steps.signing.outputs.has_keystore == 'false'
        run: ./gradlew assembleDebug --no-daemon

      - name: Resolve release tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect built APKs
        id: apks
        run: |
          set -euo pipefail
          if [[ "${{ steps.signing.outputs.has_keystore }}" == "true" ]]; then
            variant=release
          else
            variant=debug
          fi
          mkdir -p dist
          count=0
          while IFS= read -r -d '' apk; do
            # Prefix with the module's project dir name (e.g. "app",
            # "theming", "calculator") so every APK gets a unique,
            # recognizable filename once collected into one flat dist/.
            rel="${apk#./}"
            module_path="${rel%/build/outputs/apk/*}"
            module=$(basename "$module_path")
            cp "$apk" "dist/void-${module}-${variant}.apk"
            count=$((count + 1))
          done < <(find . -path "*/build/outputs/apk/${variant}/*.apk" -print0)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [[ "$count" -eq 0 ]]; then
            echo "::error::No APKs found under any module's build/outputs/apk/${variant}" >&2
            exit 1
          fi
          ls -la dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: >-
            Void Ecosystem ${{ steps.tag.outputs.tag }}${{ steps.signing.outputs.has_keystore == 'false' && ' (debug, unsigned for production)' || '' }}
          prerelease: ${{ steps.signing.outputs.has_keystore == 'false' }}
          generate_release_notes: true
          files: dist/*.apk
          body: >-
            ${{ steps.apks.outputs.count }} apps built as separate installable APKs — grab the ones you want individually, or start with void-app-*.apk (the dashboard) to launch the rest.${{ steps.signing.outputs.has_keystore == 'false' && ' Built without the production signing secrets (KEYSTORE_BASE64 etc, see keystore/README.md), so these are debug builds: fine to sideload and test, but future signed releases will NOT install over them as an update. Set up the keystore secrets to get real, upgradeable release builds.' || '' }}

      - name: Remove signing material from the runner
        if: always()
        run: rm -f keystore.properties keystore/void-ecosystem-release.jks
